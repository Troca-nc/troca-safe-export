  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ea820892-306a-42b1-82c7-275de3bd14aa\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>body{margin:0;background:#FBF6EC;-webkit-font-smoothing:antialiased}a{color:#2E7B84;text-decoration:none}a:hover{color:#123A44}button{font-family:inherit}input::placeholder,textarea::placeholder{color:rgba(18,58,68,0.5)}input:focus,textarea:focus,select:focus{border-color:#123A44!important;box-shadow:0 0 0 3px rgba(18,58,68,0.1)}<\u002Fstyle>\n<script src=\"3f47ddaa-7df2-4d76-ae7d-0578a1d13273\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#FBF6EC;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#123A44\">\n\n  <header style=\"height:72px;border-bottom:1px solid #E4D7C3;display:flex;align-items:center;gap:20px;padding:0 48px\">\n    <a href=\"#\" style=\"display:flex;align-items:center;gap:10px\"><img src=\"56db6703-ead6-43bd-b6e9-ff2712904223\" alt=\"Kalico\" style=\"height:42px;width:auto;display:block\"><span style=\"font-family:'Instrument Serif',Georgia,serif;font-size:28px;line-height:1;color:#123A44\">Kalico<\u002Fspan><\u002Fa>\n    <nav style=\"display:flex;gap:2px;margin-left:24px;white-space:nowrap\">\n      <a href=\"#\" style=\"border-radius:8px;padding:9px 13px;font-size:15px;font-weight:500;color:#123A44\" style-hover=\"background:#F3E9D8\">Annonces<\u002Fa>\n      <a href=\"#\" style=\"border-radius:8px;padding:9px 13px;font-size:15px;font-weight:500;color:#123A44\" style-hover=\"background:#F3E9D8\">Bons plans<\u002Fa>\n      <a href=\"#\" style=\"border-radius:8px;padding:9px 13px;font-size:15px;font-weight:500;color:#123A44\" style-hover=\"background:#F3E9D8\">Pros<\u002Fa>\n      <a href=\"#\" style=\"border-radius:8px;padding:9px 13px;font-size:15px;font-weight:500;color:#123A44\" style-hover=\"background:#F3E9D8\">Covoiturage<\u002Fa>\n    <\u002Fnav>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap\">\n      <div style=\"display:flex;align-items:center;gap:9px;height:44px;padding:0 12px 0 6px;border-radius:10px;border:1px solid #E4D7C3;background:#FEFAF3\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9999px;background:rgba(85,173,179,0.14);color:#2E7B84;font-size:12px;font-weight:600\">LR<\u002Fspan><span style=\"font-size:15px;font-weight:600\">Lionel<\u002Fspan><\u002Fdiv>\n      <a href=\"#\" style=\"display:inline-flex;align-items:center;border-radius:10px;background:#A94F0A;color:#FEFAF3;padding:0 20px;height:44px;font-size:15px;font-weight:600\">Déposer<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"max-width:1240px;margin:0 auto;padding:36px 48px 0\">\n    <a href=\"#\" style=\"font-size:15px;font-weight:600\">← Retour au calendrier<\u002Fa>\n    <div style=\"margin-top:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap\">\n      <div style=\"max-width:700px\">\n        <p style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#9E4E06\">Événement · Billetterie intégrée<\u002Fp>\n        <h1 style=\"margin:8px 0 0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:60px;line-height:1.02;letter-spacing:-0.015em\">Publie ton événement.<\u002Fh1>\n        <p style=\"margin:14px 0 0;font-size:18px;line-height:1.55;color:rgba(18,58,68,0.68)\">Décris-le, ajoute des billets si tu veux, puis gère les réservations et le scan depuis Kalico.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:15px;color:rgba(18,58,68,0.68)\"><span style=\"width:10px;height:10px;border-radius:9999px;background:#E8832A\"><\u002Fspan>{{ doneCount }} sur 5 blocs prêts<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1240px;margin:0 auto;padding:32px 48px 80px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start\">\n\n    <main style=\"flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n\n      <section style=\"border-radius:18px;border:1px solid #E4D7C3;background:#FEFAF3;box-shadow:0 3px 14px rgba(18,58,68,0.05);padding:28px\">\n        <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:36px;border-radius:9999px;background:#0E2A31;color:#FBF6EC;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center\">1<\u002Fspan><h2 style=\"margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:32px;line-height:1.1\">L'événement<\u002Fh2><\u002Fdiv>\n        <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:18px\">\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Titre\n            <input type=\"text\" value=\"{{ f.title }}\" sc-camel-on-input=\"{{ on.title }}\" placeholder=\"Ex. Marché de Noël de Dumbéa\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 16px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Catégorie<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"8\"><button aria-pressed=\"{{ c.on }}\" sc-camel-on-click=\"{{ c.pick }}\" style=\"height:44px;padding:0 18px;border-radius:9999px;border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};font-size:15px;font-weight:600;cursor:pointer\">{{ c.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Description\n            <textarea value=\"{{ f.desc }}\" sc-camel-on-input=\"{{ on.desc }}\" rows=\"4\" placeholder=\"Programme, public visé, ce qu'il faut savoir avant de venir.\" style=\"box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:14px 16px;font-size:17px;line-height:1.5;font-family:inherit;color:#123A44;outline:none;resize:vertical;font-weight:400\"><\u002Ftextarea><\u002Flabel>\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Photo de couverture <span style=\"font-weight:400;color:rgba(18,58,68,0.68)\">· facultative<\u002Fspan><\u002Fspan>\n            <div style=\"height:200px;border-radius:14px;overflow:hidden;border:1px dashed #CFC0A8;background:#F3E9D8\"><image-slot id=\"event-cover\" shape=\"rect\" placeholder=\"Glisse une photo ici (format paysage conseillé)\" style=\"width:100%;height:100%\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-radius:18px;border:1px solid #E4D7C3;background:#FEFAF3;box-shadow:0 3px 14px rgba(18,58,68,0.05);padding:28px\">\n        <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:36px;border-radius:9999px;background:#0E2A31;color:#FBF6EC;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center\">2<\u002Fspan><h2 style=\"margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:32px;line-height:1.1\">Quand et où<\u002Fh2><\u002Fdiv>\n        <div style=\"margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px\">\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Date<input type=\"date\" value=\"{{ f.date }}\" sc-camel-on-input=\"{{ on.date }}\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 14px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Début<input type=\"time\" value=\"{{ f.start }}\" sc-camel-on-input=\"{{ on.start }}\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 14px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Fin <span style=\"font-weight:400;color:rgba(18,58,68,0.68);display:none\"><\u002Fspan><input type=\"time\" value=\"{{ f.end }}\" sc-camel-on-input=\"{{ on.end }}\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 14px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Lieu<input type=\"text\" value=\"{{ f.place }}\" sc-camel-on-input=\"{{ on.place }}\" placeholder=\"Ex. Place du marché\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 16px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Commune\n            <sc-raw-select value=\"{{ f.commune }}\" sc-camel-on-change=\"{{ on.commune }}\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 14px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><option value=\"\">Choisir une commune<\u002Foption><sc-for list=\"{{ communes }}\" as=\"co\" hint-placeholder-count=\"6\"><option value=\"{{ co }}\">{{ co }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <\u002Fdiv>\n        <label style=\"margin-top:16px;display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Adresse <span style=\"font-weight:400;color:rgba(18,58,68,0.68)\">· facultative<\u002Fspan><input type=\"text\" value=\"{{ f.address }}\" sc-camel-on-input=\"{{ on.address }}\" placeholder=\"Rue, numéro, repère utile\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 16px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n      <\u002Fsection>\n\n      <section style=\"border-radius:18px;border:1px solid #E4D7C3;background:#FEFAF3;box-shadow:0 3px 14px rgba(18,58,68,0.05);padding:28px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n          <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:36px;border-radius:9999px;background:#0E2A31;color:#FBF6EC;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center\">3<\u002Fspan><h2 style=\"margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:32px;line-height:1.1\">Billetterie<\u002Fh2><\u002Fdiv>\n          <button role=\"switch\" aria-checked=\"{{ ticketingOn }}\" sc-camel-on-click=\"{{ toggleTicketing }}\" style=\"display:inline-flex;align-items:center;gap:12px;height:44px;border:0;background:transparent;cursor:pointer;font-size:16px;font-weight:600;color:#123A44;padding:0\"><span style=\"position:relative;width:46px;height:26px;border-radius:9999px;background:{{ tkBg }}\"><span style=\"position:absolute;top:4px;left:{{ tkX }}px;width:18px;height:18px;border-radius:9999px;background:#FEFAF3;box-shadow:0 1px 3px rgba(18,58,68,0.3)\"><\u002Fspan><\u002Fspan>{{ tkLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:rgba(18,58,68,0.68)\">{{ tkHelp }}<\u002Fp>\n\n        <sc-if value=\"{{ ticketingOn }}\">\n          <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:14px\">\n            <sc-for list=\"{{ tickets }}\" as=\"t\" hint-placeholder-count=\"1\">\n              <div style=\"border-radius:14px;border:1px solid #E4D7C3;background:#FBF6EC;overflow:hidden;display:grid;grid-template-columns:8px minmax(0,1fr)\">\n                <div style=\"background:#E8832A\"><\u002Fdiv>\n                <div style=\"padding:18px 20px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\"><span style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#9E4E06\">Billet {{ t.n }}<\u002Fspan><sc-if value=\"{{ t.canRemove }}\"><button sc-camel-on-click=\"{{ t.remove }}\" aria-label=\"Retirer le billet {{ t.n }}\" style=\"height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:rgba(18,58,68,0.68);font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"background:#F3E9D8\">Retirer<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n                  <div style=\"margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n                    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600\">Nom<input type=\"text\" value=\"{{ t.name }}\" sc-camel-on-input=\"{{ t.setName }}\" style=\"height:48px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FEFAF3;padding:0 14px;font-size:16px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n                    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600\">Prix (XPF)<input type=\"number\" min=\"0\" value=\"{{ t.price }}\" sc-camel-on-input=\"{{ t.setPrice }}\" style=\"height:48px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FEFAF3;padding:0 14px;font-size:16px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n                    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600\">Places<input type=\"number\" min=\"1\" value=\"{{ t.qty }}\" sc-camel-on-input=\"{{ t.setQty }}\" style=\"height:48px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FEFAF3;padding:0 14px;font-size:16px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n                  <\u002Fdiv>\n                  <label style=\"margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600\">Description <span style=\"font-weight:400;color:rgba(18,58,68,0.68)\">· facultative<\u002Fspan><input type=\"text\" value=\"{{ t.desc }}\" sc-camel-on-input=\"{{ t.setDesc }}\" placeholder=\"Ex. Entrée seule, boisson non comprise\" style=\"height:48px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FEFAF3;padding:0 14px;font-size:16px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ addTicket }}\" style=\"height:52px;border-radius:12px;border:1px dashed #123A44;background:transparent;color:#123A44;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:#F3E9D8\">+ Ajouter un type de billet<\u002Fbutton>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-radius:12px;background:#F3E9D8;padding:14px 18px;font-size:16px\"><span>Capacité totale <b style=\"font-weight:600\">{{ capacity }} places<\u002Fb><\u002Fspan><span style=\"color:rgba(18,58,68,0.68)\">Chaque billet reçoit un QR code unique, scanné à l'entrée depuis Kalico.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section style=\"border-radius:18px;border:1px solid #E4D7C3;background:#FEFAF3;box-shadow:0 3px 14px rgba(18,58,68,0.05);padding:28px\">\n        <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:36px;border-radius:9999px;background:#0E2A31;color:#FBF6EC;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center\">4<\u002Fspan><h2 style=\"margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:32px;line-height:1.1\">L'organisateur<\u002Fh2><\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:rgba(18,58,68,0.68)\">Ces informations sont reprises de ton profil. Les visiteurs te contactent par la messagerie : ton e-mail et ton téléphone ne sont pas affichés.<\u002Fp>\n        <div style=\"margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Nom de l'organisateur<input type=\"text\" value=\"{{ f.org }}\" sc-camel-on-input=\"{{ on.org }}\" placeholder=\"Association, commerce ou nom\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 16px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Site web <span style=\"font-weight:400;color:rgba(18,58,68,0.68)\">· facultatif<\u002Fspan><input type=\"text\" value=\"{{ f.web }}\" sc-camel-on-input=\"{{ on.web }}\" placeholder=\"https://\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 16px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">E-mail de contact<input type=\"email\" value=\"{{ f.email }}\" sc-camel-on-input=\"{{ on.email }}\" placeholder=\"nom@exemple.nc\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 16px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600\">Téléphone <span style=\"font-weight:400;color:rgba(18,58,68,0.68)\">· facultatif<\u002Fspan><input type=\"tel\" value=\"{{ f.phone }}\" sc-camel-on-input=\"{{ on.phone }}\" placeholder=\"+687\" style=\"height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #CFC0A8;background:#FBF6EC;padding:0 16px;font-size:17px;font-family:inherit;color:#123A44;outline:none;font-weight:400\"><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-radius:18px;background:#0E2A31;color:#FBF6EC;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n        <div style=\"max-width:520px\"><div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:32px;line-height:1.1\">Prêt à publier ?<\u002Fdiv><p style=\"margin:8px 0 0;font-size:16px;line-height:1.5;color:rgba(251,246,236,0.72)\">{{ readyMsg }}<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;white-space:nowrap;flex-shrink:0\"><button style=\"height:52px;padding:0 22px;border-radius:10px;border:1px solid rgba(251,246,236,0.5);background:transparent;color:#FBF6EC;font-size:16px;font-weight:600;cursor:pointer\">Enregistrer le brouillon<\u002Fbutton><button sc-camel-on-click=\"{{ publish }}\" style=\"height:52px;padding:0 28px;border:0;border-radius:10px;background:{{ pubBg }};color:{{ pubFg }};font-size:16px;font-weight:600;cursor:pointer\">Publier l'événement<\u002Fbutton><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n\n    <aside style=\"flex:0 1 400px;min-width:300px;position:sticky;top:24px;display:flex;flex-direction:column;gap:20px\">\n      <div>\n        <p style=\"margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:rgba(18,58,68,0.68)\">Aperçu · tel que les visiteurs le verront<\u002Fp>\n        <article style=\"border-radius:18px;border:1px solid #E4D7C3;background:#FEFAF3;box-shadow:0 8px 28px rgba(18,58,68,0.1);overflow:hidden\">\n          <div style=\"position:relative;height:190px;background:#F3E9D8;display:flex;align-items:center;justify-content:center;color:rgba(18,58,68,0.45)\">\n            <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:44px;height:44px\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><circle cx=\"9\" cy=\"9\" r=\"2\"><\u002Fcircle><path d=\"m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21\"><\u002Fpath><\u002Fsvg>\n            <span style=\"position:absolute;left:14px;top:14px;border-radius:9999px;background:#0E2A31;color:#FBF6EC;padding:5px 12px;font-size:13px;font-weight:600\">{{ pv.cat }}<\u002Fspan>\n            <div style=\"position:absolute;right:14px;top:14px;width:62px;border-radius:12px;background:#FEFAF3;text-align:center;padding:8px 0 9px;box-shadow:0 2px 8px rgba(18,58,68,0.15)\"><div style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9E4E06\">{{ pv.month }}<\u002Fdiv><div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1\">{{ pv.day }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px 20px 20px\">\n            <div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1.1;letter-spacing:-0.01em;opacity:{{ pv.titleOp }}\">{{ pv.title }}<\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:15px;line-height:1.5;color:rgba(18,58,68,0.68);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden\">{{ pv.desc }}<\u002Fdiv>\n            <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:15px\"><span>{{ pv.when }}<\u002Fspan><span style=\"color:#2E7B84;font-weight:600\">{{ pv.where }}<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #EFE3D0;display:flex;align-items:center;justify-content:space-between\"><span style=\"font-family:'Instrument Serif',Georgia,serif;font-size:28px;line-height:1\">{{ pv.price }}<\u002Fspan><span style=\"border-radius:10px;background:#A94F0A;color:#FEFAF3;padding:11px 18px;font-size:15px;font-weight:600\">{{ pv.cta }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n\n      <div style=\"border-radius:18px;border:1px solid #E4D7C3;background:#FEFAF3;padding:20px 22px\">\n        <div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:24px;line-height:1.1\">Avant de publier<\u002Fdiv>\n        <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ checks }}\" as=\"k\" hint-placeholder-count=\"5\"><div style=\"display:flex;align-items:center;gap:12px;font-size:15px;color:{{ k.fg }}\"><span style=\"flex-shrink:0;width:22px;height:22px;border-radius:9999px;background:{{ k.bg }};color:#FEFAF3;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ k.mark }}<\u002Fspan>{{ k.label }}<\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-radius:18px;border:1px dashed #CFC0A8;padding:18px 22px\">\n        <div style=\"font-size:16px;font-weight:600\">Un doute ?<\u002Fdiv>\n        <p style=\"margin:6px 0 0;font-size:15px;line-height:1.5;color:rgba(18,58,68,0.68)\">Publie d'abord un événement gratuit pour tester, tu pourras ajouter des billets payants ensuite.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { f: { title: '', desc: '', date: '', start: '19:00', end: '', place: '', commune: '', address: '', org: '', web: '', email: '', phone: '' }, cat: '', ticketing: true, tickets: [{ name: 'Standard', price: '0', qty: '100', desc: '' }], tried: false };\n  renderVals() {\n    const { f, cat, ticketing, tickets, tried } = this.state;\n    const setF = (k) => (e) => this.setState((s) => ({ f: Object.assign({}, s.f, { [k]: e.target.value }) }));\n    const on = {}; Object.keys(f).forEach((k) => { on[k] = setF(k); });\n    const upT = (i, k) => (e) => this.setState((s) => ({ tickets: s.tickets.map((t, j) => (j === i ? Object.assign({}, t, { [k]: e.target.value }) : t)) }));\n    const cap = tickets.reduce((n, t) => n + (parseInt(t.qty, 10) || 0), 0);\n    const prices = tickets.map((t) => parseInt(t.price, 10) || 0);\n    const minP = Math.min.apply(null, prices), maxP = Math.max.apply(null, prices);\n    const fmt = (n) => n.toLocaleString('fr-FR').replace(/\\u202f/g, ' ') + ' XPF';\n    const price = !ticketing ? 'Entrée libre' : maxP === 0 ? 'Gratuit' : minP === maxP ? fmt(minP) : 'Dès ' + fmt(minP);\n    const months = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];\n    const d = f.date ? new Date(f.date + 'T00:00:00') : null;\n    const days = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];\n    const hm = (t) => t.replace(':', ' h ').replace(/ h 00$/, ' h');\n    const when = d ? days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + (f.start ? ' à ' + hm(f.start) : '') + (f.end ? ' \\u2013 ' + hm(f.end) : '') : 'Date à définir';\n    const where = [f.place, f.commune].filter(Boolean).join(', ') || 'Lieu à définir';\n    const checks = [\n      ['Titre et catégorie', !!f.title.trim() && !!cat], ['Date et heure de début', !!f.date && !!f.start], ['Lieu et commune', !!f.place.trim() && !!f.commune],\n      [ticketing ? 'Billets : nom et places' : 'Billetterie désactivée', !ticketing || tickets.every((t) => t.name.trim() && (parseInt(t.qty, 10) || 0) > 0)], ['Organisateur et e-mail', !!f.org.trim() && /.+@.+\\..+/.test(f.email)]\n    ];\n    const done = checks.filter((c) => c[1]).length;\n    const ready = done === 5;\n    const CATS = ['Concert', 'Marché', 'Sport', 'Spectacle', 'Atelier', 'Fête', 'Vide-grenier', 'Autre'];\n    return {\n      f, on, doneCount: done, communes: ['Nouméa', 'Dumbéa', 'Mont-Dore', 'Païta', 'Bourail', 'Koné', 'Poindimié', 'Lifou'],\n      cats: CATS.map((l) => ({ label: l, on: String(cat === l), pick: () => this.setState({ cat: l }), bg: cat === l ? '#0E2A31' : 'transparent', fg: cat === l ? '#FBF6EC' : '#123A44', bd: cat === l ? '#0E2A31' : '#CFC0A8' })),\n      ticketingOn: ticketing, toggleTicketing: () => this.setState({ ticketing: !ticketing }), tkBg: ticketing ? '#2E7B84' : '#CFC0A8', tkX: ticketing ? 24 : 4,\n      tkLabel: ticketing ? 'Billetterie activée' : 'Sans billetterie',\n      tkHelp: ticketing ? 'Définis un ou plusieurs types de billets. Laisse le prix à 0 pour un événement gratuit avec réservation.' : 'L\\u2019événement est publié avec une entrée libre, sans réservation.',\n      tickets: tickets.map((t, i) => ({ n: i + 1, name: t.name, price: t.price, qty: t.qty, desc: t.desc, canRemove: tickets.length > 1, setName: upT(i, 'name'), setPrice: upT(i, 'price'), setQty: upT(i, 'qty'), setDesc: upT(i, 'desc'),\n        remove: () => this.setState((s) => ({ tickets: s.tickets.filter((_, j) => j !== i) })) })),\n      addTicket: () => this.setState((s) => ({ tickets: s.tickets.concat([{ name: '', price: '0', qty: '50', desc: '' }]) })),\n      capacity: cap.toLocaleString('fr-FR').replace(/\\u202f/g, ' '),\n      pv: { cat: cat || 'Catégorie', title: f.title.trim() || 'Titre de l\\u2019événement', titleOp: f.title.trim() ? 1 : 0.45, desc: f.desc.trim() || 'La description apparaîtra ici.', month: d ? months[d.getMonth()] : 'date', day: d ? d.getDate() : '\\u2013', when, where, price, cta: ticketing ? 'Réserver' : 'Voir' },\n      checks: checks.map((c) => ({ label: c[0], bg: c[1] ? '#6E9A6A' : '#CFC0A8', mark: c[1] ? '\\u2713' : '', fg: c[1] ? '#123A44' : 'rgba(18,58,68,0.68)' })),\n      readyMsg: ready ? 'Tout est renseigné. Ton événement sera visible dès la publication.' : 'Il reste ' + (5 - done) + ' bloc' + (5 - done > 1 ? 's' : '') + ' à compléter. Vérifie la liste à droite.',\n      pubBg: ready ? '#E8832A' : 'rgba(251,246,236,0.18)', pubFg: ready ? '#0E2A31' : 'rgba(251,246,236,0.72)',\n      publish: () => this.setState({ tried: true })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
