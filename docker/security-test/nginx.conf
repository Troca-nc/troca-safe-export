# Isolated Nginx configuration used only by the security-boundary harness.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format security_test '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status';
  access_log /var/log/nginx/access.log security_test;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  upstream backend { server security-backend:3001; }

  server {
    listen 8080;
    server_name security.local;

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/uploads/[0-9]+ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # Mirrors the current vulnerable boundary for characterization only.
    location /uploads/ {
      alias /app/uploads/;
      expires 30d;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff;
    }
  }
}
