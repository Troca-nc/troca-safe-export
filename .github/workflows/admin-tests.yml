name: Admin contract tests

on:
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin-tests.yml'
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-tests.yml'

permissions:
  contents: read

concurrency:
  group: admin-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.1.1
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace
        working-directory: admin
      - run: node --test tests/load.test.cjs
        working-directory: admin
      - run: node node_modules/next/dist/bin/next build
        working-directory: admin
