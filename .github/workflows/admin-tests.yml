name: Admin contract tests

on:
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin-tests.yml'
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-tests.yml'

permissions:
  contents: read

concurrency:
  group: admin-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.1.1
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace
        working-directory: admin
      - run: node --test tests/*.test.cjs
        working-directory: admin
      - run: node node_modules/next/dist/bin/next build
        working-directory: admin
      - run: node tests/http-boundary.smoke.cjs
        working-directory: admin
      - run: node tests/redis-session.smoke.cjs
        working-directory: admin
        env:
          ADMIN_TEST_REDIS_URL: redis://127.0.0.1:6379
