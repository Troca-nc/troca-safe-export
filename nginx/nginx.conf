# ============================================================
# Nginx - main configuration
# ============================================================
#
# Rendered at container start by docker/nginx/entrypoint.sh.
# The actual server blocks are generated into /tmp/nginx-rendered/conf.d.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type   application/octet-stream;

  # Logs
  log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Security
  server_tokens off;
  add_header X-Frame-Options        "SAMEORIGIN"                      always;
  add_header X-Content-Type-Options  "nosniff"                         always;
  add_header X-XSS-Protection        "1; mode=block"                   always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

  # Rate limiting
  # TODO: test rate limits in staging after deploy.
  limit_req_zone $binary_remote_addr zone=api:10m          rate=60r/m;
  limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_listings:10m  rate=30r/m;
  limit_req_zone $binary_remote_addr zone=upload:10m       rate=10r/m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # Upstreams
  upstream backend  { zone backend 64k;  least_conn; server backend:3001 resolve;  keepalive 32; }
  upstream frontend { zone frontend 64k; least_conn; server frontend:3000 resolve; keepalive 16; }

  include /tmp/nginx-rendered/conf.d/*.conf;
}
