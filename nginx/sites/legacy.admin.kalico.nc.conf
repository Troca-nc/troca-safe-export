# Former admin domain: preserve ACME renewal and redirect to the new isolated
# admin hostname. The canonical admin allowlist remains enforced there.

# >>> HTTP_ONLY_BEGIN
server {
    listen 80;
    server_name ${LEGACY_ADMIN_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://${ADMIN_SERVER_NAME}$request_uri;
    }
}
# <<< HTTP_ONLY_END

# >>> HTTPS_BEGIN
server {
    listen 80;
    server_name ${LEGACY_ADMIN_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://${ADMIN_SERVER_NAME}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${LEGACY_ADMIN_SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${LEGACY_ADMIN_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LEGACY_ADMIN_SERVER_NAME}/privkey.pem;

    return 308 https://${ADMIN_SERVER_NAME}$request_uri;
}
# <<< HTTPS_END
