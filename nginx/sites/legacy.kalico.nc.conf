# Former public domain: preserve ACME renewal and permanently redirect every
# path to the canonical domain. 308 keeps the HTTP method and request body,
# which matters for old API and webhook clients during the transition.

# >>> HTTP_ONLY_BEGIN
server {
    listen 80;
    server_name ${LEGACY_SERVER_NAME} www.${LEGACY_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://${SERVER_NAME}$request_uri;
    }
}
# <<< HTTP_ONLY_END

# >>> HTTPS_BEGIN
server {
    listen 80;
    server_name ${LEGACY_SERVER_NAME} www.${LEGACY_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://${SERVER_NAME}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${LEGACY_SERVER_NAME} www.${LEGACY_SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${LEGACY_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LEGACY_SERVER_NAME}/privkey.pem;

    return 308 https://${SERVER_NAME}$request_uri;
}
# <<< HTTPS_END
