# ============================================================
# Admin site template
# Rendered by docker/nginx/entrypoint.sh
#
# NGINX_SSL_ENABLED=false -> HTTP-only bootstrap
# NGINX_SSL_ENABLED=true  -> HTTP redirect + HTTPS production
# ============================================================

# >>> HTTP_ONLY_BEGIN
server {
    listen 80;
    server_name ${ADMIN_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        satisfy any;
    }

    allow 179.65.151.110;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://admin:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# <<< HTTP_ONLY_END

# >>> HTTPS_BEGIN
server {
    listen 80;
    server_name ${ADMIN_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        satisfy any;
    }

    location / {
        return 301 https://${ADMIN_SERVER_NAME}$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ${ADMIN_SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${ADMIN_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${ADMIN_SERVER_NAME}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    allow 203.0.113.10;
    allow 127.0.0.1;
    deny all;

    # Security headers for the isolated admin surface
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self' 'unsafe-inline';
        style-src   'self' 'unsafe-inline';
        img-src     'self' data: blob:;
        font-src    'self' data:;
        connect-src 'self';
        frame-ancestors 'none';
        object-src  'none';
        base-uri    'self';
        form-action 'self';
    " always;

    location / {
        proxy_pass http://admin:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# <<< HTTPS_END
